[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-metric-lens-cn"
version = "0.1.0"
description = "Bilingual (CN/EN) diagnostic & attribution lens for Virtual Embryo Challenge (veckit) scores"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
veckit = ["veckit @ git+https://github.com/aristoteleo/vec_baselines.git"]
dev = ["pytest>=7.4"]

[project.scripts]
vec-lens = "vec_lens.cli:main"

[tool.setuptools.packages.find]
include = ["vec_lens*"]
